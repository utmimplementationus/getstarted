name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - main                       # production deploys
      - public_page_improvements   # pre-merge preview (remove once merged to main)
    paths:
      - "site/**"                  # only redeploy when the site changes
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:                # allow manual runs from the Actions tab

# Run the bundled JavaScript actions on Node 24 (Node 20 is being deprecated in 2026).
# Lets us keep the current action versions without waiting on new releases.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Permissions the Pages deploy needs
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-progress run finish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the /site folder as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
